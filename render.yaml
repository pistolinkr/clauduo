databases:
  - name: clauduo-db
    plan: basic-256mb
    region: singapore
services:
  - type: web
    name: clauduo
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://clauduo.com
      - key: DATABASE_URL
        fromDatabase:
          name: clauduo-db
          property: connectionString
      - key: CLAUDUO_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
